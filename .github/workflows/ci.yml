# Checks for every pull request and push. Never receives AWS credentials.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.2

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install gpg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg

      - name: Run tests
        run: make unit

  infra:
    name: OpenTofu validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false

      - name: Format and validate every stack
        run: make infra-validate

  security:
    name: Trivy (config, secrets, dependencies)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # upload results to Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Report-only for now: findings appear in Security > Code scanning
      # without failing the build.
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret,vuln
          format: sarif
          output: trivy-repo.sarif
          exit-code: "0"

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
