{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main %}
<div class="login">
  <div class="login-card">
    <div class="brand brand-login">
      <span class="brand-mark" aria-hidden="true">{% include "icons/anchor.svg" %}</span>
      <span class="brand-text"><strong>SFTP Console</strong><span>Client manifests</span></span>
    </div>
    <h1>Operator sign in</h1>
    {% if error %}<div class="notice notice-error" role="alert">{% include "icons/circle-alert.svg" %}<p>{{ error }}</p></div>{% endif %}
    <form method="post" action="/login" class="stack">
      <label class="field">
        <span class="field-label">Operator</span>
        <input name="name" value="{{ name or '' }}" autocomplete="username" required autofocus spellcheck="false">
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="button primary wide" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
