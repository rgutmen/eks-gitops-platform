# The sftp-platform namespace is created by the pgp-worker base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: sftp-platform
      app.kubernetes.io/component: sftp-console
