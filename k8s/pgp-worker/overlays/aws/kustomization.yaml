# AWS overlay: injects account-specific values into the base manifests.
# Inputs (git-ignored, generated by `make k8s-config`):
#   config.env  application settings -> ConfigMap pgp-worker
#   deploy.env  role ARN and image   -> local-only, never applied
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: pgp-worker
    namespace: sftp-platform
    envs:
      - config.env
  - name: pgp-worker-deploy
    namespace: sftp-platform
    envs:
      - deploy.env
    options:
      annotations:
        config.kubernetes.io/local-config: "true"

replacements:
  - source:
      kind: ConfigMap
      name: pgp-worker-deploy
      fieldPath: data.WORKER_ROLE_ARN
    targets:
      - select:
          kind: ServiceAccount
          name: pgp-worker
        fieldPaths:
          - metadata.annotations.[eks.amazonaws.com/role-arn]
        options:
          create: true
  - source:
      kind: ConfigMap
      name: pgp-worker-deploy
      fieldPath: data.WORKER_IMAGE
    targets:
      - select:
          kind: Deployment
          name: pgp-worker
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
  - source:
      kind: ConfigMap
      name: pgp-worker
      fieldPath: data.QUEUE_URL
    targets:
      - select:
          kind: ScaledObject
          name: pgp-worker
        fieldPaths:
          - spec.triggers.0.metadata.queueURL
  - source:
      kind: ConfigMap
      name: pgp-worker
      fieldPath: data.AWS_REGION
    targets:
      - select:
          kind: ScaledObject
          name: pgp-worker
        fieldPaths:
          - spec.triggers.0.metadata.awsRegion
