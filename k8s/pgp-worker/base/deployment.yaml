apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgp-worker
  namespace: sftp-platform
spec:
  # KEDA owns the replica count (0..N). Never set it from Git.
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pgp-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgp-worker
    spec:
      serviceAccountName: pgp-worker
      # Longer than the slowest batch, so a pod finishes its messages on SIGTERM.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: pgp-worker:replaced-by-overlay # the overlay sets the ECR image and commit tag
          envFrom:
            - configMapRef:
                name: pgp-worker
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # gpg needs a writable temporary home.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
